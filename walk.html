<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>東京散步路線</title>
    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="stylesheet" href="./CSS/walk.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <!-- 標題列 -->
    <nav>
      <ul>
        <li>
          <a href="./index.html">Home</a>
        </li>
      </ul>
    </nav>

    <!-- hero -->
    <section class="hero">
      <h1>東京散步路線</h1>
      <p class="description">探索東京的街道</p>
    </section>

    <!-- 卡片1 -->
    <section class="walk-route">
      <article class="route">
        <h2>山手線沿線（秋葉原→御徒町→上野公園）</h2>
        <p>沿著山手線一路散步，探索秋葉原、御徒町與上野公園周邊的特色街區</p>

        <!-- 路線簡介 -->
        <div class="route-info">
          <span>距離：1.6 KM</span>
          <span>推薦景點：阿美橫町，上野公園，友都八喜</span>
        </div>

        <!-- timeline -->
        <div class="content">
          <!-- 第一站 -->
          <div class="timeline">
            <!-- <div class="time">10:00</div> -->

            <div class="marker">
              <div class="dot"></div>
              <div class="line"></div>
            </div>

            <div class="spot-info">
              <h3>上野</h3>
              <p>鄰近上野車站的上野公園內有許多文藝景點</p>
              <span>上野公園</span>
              <span>動物園</span>
              <span>美術館</span>
              <span>科博館</span>
            </div>
          </div>

          <!-- 第二站 -->
          <div class="timeline">
            <!-- <div class="time">11:00</div> -->

            <div class="marker">
              <div class="dot"></div>
              <div class="line"></div>
            </div>

            <div class="spot-info">
              <h3>阿美橫町</h3>
              <p>從電器街開始散步，探索秋葉原的特色街區</p>
              <span> Uniqlo</span>
              <span> 阿美橫町</span>
            </div>
          </div>

          <!-- 第三站 -->
          <div class="timeline">
            <!-- <div class="time">11:00</div> -->

            <div class="marker">
              <div class="dot"></div>
              <div class="line"></div>
            </div>

            <div class="spot-info">
              <h3>御徒町</h3>
              <p>從電器街開始散步，探索秋葉原的特色街區</p>
              <span> Uniqlo</span>
              <span> 阿美橫町</span>
            </div>
          </div>

          <!-- 第四站 -->
          <div class="timeline">
            <!-- <div class="time">11:00</div> -->

            <div class="marker">
              <div class="dot"></div>
              <div class="line"></div>
            </div>

            <div class="spot-info">
              <h3>秋葉原</h3>
              <p>逛阿美橫町，感受東京老街氣氛。</p>
            </div>
          </div>
        </div>
      </article>
    </section>

    <footer>
      <p>© 2026 Travel Note</p>
    </footer>
  </body>
</html>
