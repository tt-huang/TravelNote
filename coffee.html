<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tokyo Coffee Journey</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@200..900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
      integrity="sha512-Kc323vGBEqzTmouAECnVceyQqyqdsSiqLQISBL29aUW4U/M7pSPA/gEUZQqv1cwx4OnYxTxve5UMg5GT6L4JJg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./CSS/style.css" />
    <link rel="stylesheet" href="./CSS/coffee.css" />
  </head>
  <body>
    <!-- 標題列 -->
    <nav>
      <ul>
        <li>
          <a href="./index.html">Home</a>
        </li>
      </ul>
    </nav>

    <!-- hero -->
    <section class="hero">
      <h1>Tokyo Coffee Journey</h1>
      <p class="description">我的咖啡收藏</p>
    </section>

    <!-- 卡片 -->
    <section class="coffee-container">
      <!-- 卡片 1 -->
      <article class="cafe-card">
        <div class="cafe-photo">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQJutnadDh4TSJfwh3sPjJRTDnS3BBncpLF8NhDkUKFyw&s=10"
            alt=""
          />
        </div>

        <h2>Allpress Espresso 虎ノ門</h2>
        <p><i class="fa-solid fa-location-dot"></i> 虎之門</p>
        <a
          href="https://maps.app.goo.gl/cQZBtS8pHynz3QRC8"
          class="map"
          target="_blank"
          rel="noreferrer"
          ><i class="fa-solid fa-map-location-dot"></i> Google Maps</a
        >
      </article>

      <!-- 卡片 2 -->
      <article class="cafe-card">
        <div class="cafe-photo">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ3Z3B4-0s5W0cbMU8gNCDrYJSott4XBkVH3wjOYhLv4w&s=10"
            alt=""
          />
        </div>
        <h2>BONGEN COFFEE 銀座</h2>
        <p><i class="fa-solid fa-location-dot"></i> 東銀座</p>
        <a
          href="https://maps.app.goo.gl/rgKTEZ2aWGJJhZYH6"
          class="map"
          target="_blank"
          rel="noreferrer"
          ><i class="fa-solid fa-map-location-dot"></i> Google Maps</a
        >
      </article>

      <!-- 卡片 3 -->
      <article class="cafe-card">
        <div class="cafe-photo">
          <img
            src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR4mToxWgU2czbmPlmFp3zoH_95UUYmDo-MVm5dS5ZBWg&s=10"
            alt=""
          />
        </div>
        <h2>ROSTRO</h2>
        <p><i class="fa-solid fa-location-dot"></i> 代代木公園</p>
        <a
          href="https://maps.app.goo.gl/9wYwdy3Ag663nwVAA"
          class="map"
          target="_blank"
          rel="noreferrer"
          ><i class="fa-solid fa-map-location-dot"></i> Google Maps</a
        >
      </article>
    </section>

    <!-- footer -->
    <footer>
      <p>© 2026 Travel Note</p>
    </footer>
  </body>
</html>
